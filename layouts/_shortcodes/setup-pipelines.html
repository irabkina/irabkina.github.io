{{- /* Previous vs new setup in "Knowing When to Re-Represent": authored
       beliefs vs beliefs derived from epistemic history. The authored belief
       spans the two steps that replace it, so the setups line up by stage.
       The first column is wider so mental_state fits on one line. */ -}}
<figure class="flow" style="--flow-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr))">
	<section class="flow__lane">
		<p class="flow__lane-title">Previous setup: authored beliefs (a lookup)</p>
		<ol class="flow__steps">
			<li class="flow__node flow__node--sparse">
				<strong>Scenario file (YAML)</strong>
				<ul>
					<li>world state</li>
					<li>events</li>
					<li><code>mental_state</code> (authored)</li>
					<li>question</li>
				</ul>
			</li>
			<li class="flow__node flow__node--rich flow__node--span-2">
				<strong>Authored mental state</strong>
				<span class="flow__quote">“Sam believes the report is in the office.”</span>
			</li>
			<li class="flow__node flow__node--rich">
				<strong>Rich representation</strong>
				Scenario + authored belief
			</li>
			<li class="flow__node flow__node--jev">
				<strong>Jev inference</strong>
				<span class="flow__note">→&nbsp;probability distribution over answers</span>
			</li>
		</ol>
	</section>
	<section class="flow__lane">
		<p class="flow__lane-title">New setup: derive beliefs from epistemic history</p>
		<ol class="flow__steps">
			<li class="flow__node flow__node--sparse">
				<strong>Scenario file (YAML)</strong>
				<ul>
					<li>world state</li>
					<li>events</li>
					<li>question</li>
				</ul>
				<span class="flow__note">no <code>mental_state</code></span>
			</li>
			<li class="flow__node flow__node--history">
				<strong>Knowledge graph (Neo4j)</strong>
				<ul>
					<li>entities</li>
					<li>events</li>
					<li>locations</li>
					<li>witnesses</li>
					<li>temporal order</li>
				</ul>
			</li>
			<li class="flow__node flow__node--rich">
				<strong>Materialize beliefs</strong>
				<span class="flow__quote">“Sam believes the report is in the office.”</span>
				<span class="flow__note">derived, not authored</span>
			</li>
			<li class="flow__node flow__node--rich">
				<strong>Rich representation</strong>
				Scenario + derived belief(s), relevant agent only
			</li>
			<li class="flow__node flow__node--jev">
				<strong>Jev inference</strong>
				<span class="flow__note">→&nbsp;probability distribution over answers</span>
			</li>
		</ol>
	</section>
</figure>
